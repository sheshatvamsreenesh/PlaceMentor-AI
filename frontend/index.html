<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaceMentor AI</title>
</head>

<body>
    <h1>PlaceMentor AI Frontend is running!</h1>

    <!-- This text will change when the backend responds -->
    <p id="backend-status">Connecting to backend...</p>

    <script>
        // Send a request to our Flask backend
        fetch("http://127.0.0.1:5001/api/test")
            .then(response => response.json())
            .then(data => {
                // Display the message received from Flask
                document.getElementById("backend-status").textContent =
                    data.message;
            })
            .catch(error => {
                // Display this if the frontend cannot reach Flask
                document.getElementById("backend-status").textContent =
                    "Could not connect to backend.";

                console.error("Backend connection error:", error);
            });
    </script>
</body>
</html>
